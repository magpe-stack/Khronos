
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Khronos: motor de hábitos atômicos, projetos, tempo e conquistas em graus.">
  <meta name="application-name" content="Khronos">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
  <title>Khronos — Motor de Hábitos Atômicos</title>
</head>
<body>
  <div id="splash" class="splash" aria-label="Carregando Khronos">
    <img src="./icon-512.png" alt="" class="splash-gear">
    <h1>Khronos</h1>
    <p>Motor de Hábitos Atômicos</p>
  </div>

  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">☰</button>
    <button id="homeBtn" class="brand" aria-label="Voltar ao início">
      <img src="./icon-192.png" alt="" width="38" height="38">
      <span>Khronos</span>
    </button>
    <button id="themeBtn" class="icon-btn" aria-label="Alternar tema">☾</button>
  </header>

  <nav id="menu" class="menu" aria-label="Menu principal" hidden>
    <button data-page="home">⌂ Início</button>
    <button data-action="new">＋ Novo Projeto</button>
    <button data-page="projects">▤ Meus Projetos</button>
    <button data-page="gallery">★ Galeria de Conquistas</button>
    <button data-page="history">◷ Histórico</button>
    <button data-action="manual">＋ Entrada Manual</button>
    <button data-action="export">⇩ Exportar Projeto JSON</button>
    <button data-action="backup">⇩ Backup Geral</button>
    <button data-action="import">⇧ Importar / Restaurar JSON</button>
    <button data-action="print">▣ Imprimir Relatório</button>
    <button data-page="about">ⓘ Sobre o Khronos</button>
    <a href="https://github.com/magpe-stack/Khronos/blob/main/README.md" target="_blank" rel="noopener noreferrer">? Ajuda / README</a>
  </nav>

  <main id="app" tabindex="-1">
    <noscript>Ative o JavaScript para utilizar o Khronos.</noscript>
  </main>

  <footer>
    <span>Khronos — O tempo multiplica seus hábitos.</span>
    <div class="footer-links">
      <a href="https://magpe-stack.github.io/Khronos/">Aplicativo</a>
      <a href="https://github.com/magpe-stack/Khronos" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://github.com/magpe-stack/Khronos/blob/main/README.md" target="_blank" rel="noopener noreferrer">Ajuda</a>
    </div>
  </footer>

  <dialog id="dialog">
    <form id="dialogForm">
      <h2 id="dialogTitle"></h2>
      <div id="dialogFields"></div>
      <div class="dialog-actions">
        <button type="button" id="cancelDialog" class="btn secondary">Cancelar</button>
        <button type="submit" class="btn primary">Confirmar</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
